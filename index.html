<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/educa-data.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a5140" />
    <meta name="google" content="notranslate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Educação Brasil | Dados da Educação Pública</title>
    <meta name="description" content="Landing page do projeto de análise de dados públicos da educação básica brasileira — Censo Escolar, SAEB/IDEB e indicadores de fluxo escolar." />
    <script>
      // O tema padrão é o quadro verde. A classe `dark-theme` (ardósia escura) é
      // aplicada ANTES do primeiro paint quando o usuário escolheu o escuro,
      // evitando o flash de fundo ao recarregar a página.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark-theme');
        }
      } catch (e) { }
    </script>
    <style>
      /* O quadro é o fundo: pinta a base antes do primeiro paint */
      html { background-color: #2a5140; }
      html.dark-theme { background-color: #0c1a15; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
